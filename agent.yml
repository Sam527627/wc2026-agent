name: WC2026 Content Agent

# Runs in GitHub's cloud — your laptop does NOT need to be on.
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC). Cheap; finished-match scores are delayed anyway.
  workflow_dispatch: {}      # adds a "Run workflow" button so you can trigger it by hand too

permissions:
  contents: write            # lets the job commit generated content back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: wc2026-agent     # never run two copies at once
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMPETITION: WC
        run: python3 wc2026_agent.py

      - name: Commit any new content
        run: |
          git config user.name  "wc2026-agent"
          git config user.email "agent@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No new matches — nothing to commit."
          else
            git commit -m "Auto: new content $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
